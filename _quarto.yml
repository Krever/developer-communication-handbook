project:
  type: default
  output-dir: public
  render:
    - index.qmd
  # Copy the favicon into the output dir (it's referenced from the <head> below;
  # the format-level `favicon:` key only works for website projects, not this one).
  resources:
    - assets/favicon.png

# Setup carried over from the Fintech Engineering Handbook so styling decisions
# can be previewed immediately. Left behind (bring back when needed):
#   - Cloudflare analytics in _includes/head.html (needs its own token)
#   - epub format (needs a cover asset)
format:
  html:
    theme:
      - cosmo
      - theme.scss
    include-in-header:
      - _includes/head.html
    toc: true
    toc-location: left
    toc-depth: 4
    # Show Parts (##) and Sections (###) by default; fold the #### subsections
    # until you scroll into their section (Quarto auto-expands the active one).
    toc-expand: 2
    toc-title: "Contents"
    smooth-scroll: true
    anchor-sections: true
    link-external-icon: true
    link-external-newwindow: true
    code-copy: true
    format-links: false
    include-after-body:
      - _includes/enhance.html
    grid:
      sidebar-width: 320px
      body-width: 860px

  # Print/share format. Typst is bundled with Quarto, so no LaTeX install needed.
  # Fonts and colours come from _brand.yml; table styling from the include.
  typst:
    papersize: a4
    toc: true
    toc-title: "Contents"
    font-paths:
      - assets/fonts
    include-before-body:
      - _includes/typst-style.typ
