project:
  type: default
  output-dir: public
  render:
    - index.qmd

# Setup carried over from the Fintech Engineering Handbook so styling decisions
# can be previewed immediately. Left behind (bring back when needed):
#   - _includes/head.html (favicon + Cloudflare analytics — needs its own token)
#   - epub format (needs a cover asset)
format:
  html:
    theme:
      - cosmo
      - theme.scss
    toc: true
    toc-location: left
    toc-depth: 4
    toc-expand: true
    toc-title: "Contents"
    smooth-scroll: true
    anchor-sections: true
    link-external-icon: true
    link-external-newwindow: true
    code-copy: true
    format-links: false
    include-after-body:
      - _includes/enhance.html
    grid:
      sidebar-width: 320px
      body-width: 860px

  # Print/share format. Typst is bundled with Quarto, so no LaTeX install needed.
  # Fonts and colours come from _brand.yml; table styling from the include.
  typst:
    papersize: a4
    toc: true
    toc-title: "Contents"
    font-paths:
      - assets/fonts
    include-before-body:
      - _includes/typst-style.typ
