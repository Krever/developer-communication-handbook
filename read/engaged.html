  <title>Reading milestone — The Developer Communication Handbook</title>
  <!-- This page exists only to register a Cloudflare Web Analytics pageview at
       the path /read/engaged.html. It is loaded in a hidden iframe once a
       reader passes 3 minutes of active reading and 10% scroll depth
       (see _includes/enhance.html), so the dashboard separates people who read
       the handbook from people who merely opened it.

       Why two milestones: a single threshold would have to be chosen blind.
       With both, the ratios /read/engaged.html : /read/deep.html : visits show
       what a "reader" costs at each definition, and the honest one can be
       picked after the fact rather than guessed at now.

       Backfill: these counts start the day this ships, but Cloudflare still
       holds visits back to launch. Once a few weeks of overlap exist, the
       engaged:visits ratio can be applied to the historical visits to estimate
       the readers who came before — an approximation, and to be labelled as
       one wherever the number is shown. -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
          data-cf-beacon='{"token": "PASTE_CLOUDFLARE_TOKEN_HERE"}'></script>
